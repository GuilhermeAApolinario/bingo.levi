<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá do Levi Henrique</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            margin: 0; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px;
            color: #2d3436;
        }

        /* Paineis flutuantes */
        #login-screen, #bingo-screen { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        #bingo-screen { display: none; }

        h1, h2 { color: #0984e3; margin-top: 0; }
        .subtitle { color: #636e72; font-size: 16px; margin-bottom: 20px; }

        /* Estilos do Login */
        input { 
            padding: 15px; font-size: 16px; border-radius: 12px; 
            border: 2px solid #74b9ff; margin-bottom: 20px; width: 100%; 
            outline: none; font-family: 'Nunito', sans-serif; transition: 0.3s;
        }
        input:focus { border-color: #0984e3; box-shadow: 0 0 10px rgba(9,132,227,0.2); }
        
        button.btn-primary { 
            padding: 15px 30px; background: #0984e3; color: white; border: none; 
            border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; 
            transition: all 0.3s; width: 100%; box-shadow: 0 5px 15px rgba(9,132,227,0.3);
        }
        button.btn-primary:hover { background: #74b9ff; transform: translateY(-2px); }

        /* Estilos da Cartela 4x4 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            width: 100%; 
            margin-top: 15px; 
        }
        
        /* Células base */
        .cell { 
            background: #ffffff; 
            border: 1px solid #c8d6e5;
            border-radius: 12px;
            padding: 5px; 
            font-size: clamp(9px, 2.5vw, 14px); 
            font-weight: 800; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            aspect-ratio: 1/1; 
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: #4b6584;
            word-break: break-word; line-height: 1.1;
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        .cell:hover:not(.central):not(.marcado) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .cell:active:not(.central) {
            transform: scale(0.92);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.15);
        }

        /* Efeito Selecionado (Premium com Sombras e Animação) */
        .cell.marcado { 
            background: #2bcbba !important; 
            color: rgba(255, 255, 255, 0.85) !important; 
            text-decoration: line-through; 
            border-color: #26af9f !important;
            transform: scale(0.98); 
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.2) !important;
            position: relative;
            animation: carimboPop 0.4s ease-out;
            transition: all 0.3s ease-in-out;
        }

        .cell.marcado::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 2.2em; 
            color: white;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            opacity: 0; 
            animation: fadeInCheckPop 0.5s ease-out forwards; 
            animation-delay: 0.1s; 
        }

        /* Quadrado Central do Levi (Turbinado e Animado) */
        .central { 
            background: linear-gradient(135deg, #ffeaa7 0%, #f1c40f 100%) !important; 
            color: #0984e3 !important; 
            font-size: clamp(10px, 3vw, 15px) !important; 
            font-weight: 900; 
            border: 3px solid #e67e22 !important; 
            border-radius: 12px;
            pointer-events: none; 
            box-shadow: inset 0 0 15px rgba(255,255,255,0.5), 0 0 20px rgba(241, 196, 15, 0.7) !important;
            animation: pulsarGlow 2s infinite alternate !important;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            line-height: 1.2;
        }

        .central::before {
            content: "⭐";
            font-size: 1.2em;
            margin-bottom: 2px;
        }

        /* Animações */
        @keyframes carimboPop {
            0% { transform: scale(1); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
            40% { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
            100% { transform: scale(0.98); box-shadow: inset 0 3px 8px rgba(0,0,0,0.2); }
        }

        @keyframes fadeInCheckPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            60% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes pulsarGlow {
            from { box-shadow: inset 0 0 10px rgba(255,255,255,0.3), 0 0 15px rgba(241, 196, 15, 0.5); transform: scale(1); }
            to { box-shadow: inset 0 0 20px rgba(255,255,255,0.6), 0 0 30px rgba(241, 196, 15, 0.9); transform: scale(1.03); }
        }

        @keyframes piscar { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Botão Secundário */
        button.btn-secondary {
            margin-top: 25px; padding: 12px 20px; background: #ff7675; color: white; 
            border: none; border-radius: 12px; font-weight: 800; font-size: 14px; 
            cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(255,118,117,0.3);
        }
        button.btn-secondary:hover { background: #d63031; transform: translateY(-2px); }

        .bingo-alert {
            display: none; color: #d63031; font-size: 24px; font-weight: 900; 
            margin-top: 15px; animation: piscar 1s infinite alternate;
        }

        /* Responsivo (Celular) */
        @media (max-width: 600px) {
            #login-screen, #bingo-screen { padding: 15px; }
            .grid { gap: 4px; }
            .cell { padding: 2px; border-width: 1px; border-radius: 8px; }
            h1, h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="font-size: 40px; margin-bottom: 10px;">🧸</div>
        <h1>Chá do Levi</h1>
        <p class="subtitle">Digite seu nome para pegar sua cartela interativa!</p>
        <input type="text" id="nomeJogador" placeholder="Ex: Tio do Guilherme ou Tia da Maria" autocomplete="off">
        <button class="btn-primary" onclick="entrarNoJogo()">Entrar no Bingo</button>
    </div>

    <div id="bingo-screen">
        <h2>Cartela de: <span id="displayNome" style="color: #a29bfe;"></span></h2>
        <div class="grid" id="board"></div>
        
        <div id="bingoMensagem" class="bingo-alert">🎉 BINGO!!! 🎉</div>
        
        <button class="btn-secondary" onclick="gerarCartela()">🔄 Gerar Nova Cartela</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMHqbPvA1al5GS3HgncuE-At1iV1ZHJTw",
            authDomain: "bingo-levi.firebaseapp.com",
            projectId: "bingo-levi",
            storageBucket: "bingo-levi.firebasestorage.app",
            messagingSenderId: "299654685917",
            appId: "1:299654685917:web:e44f6e7b33fc413f01e734",
            measurementId: "G-7WEZMLKFWF"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let meuNome = "";
        
        const palavras = [
            "Fralda P", "Fralda M", "Fralda G", "Lenço Umedecido", "Pomada", 
            "Shampoo", "Sabonete", "Cotonete", "Algodão", "Escova", 
            "Body Curto", "Body Longo", "Macacão", "Mijão", "Meia", 
            "Sapatinho", "Touca", "Luva", "Babador", "Toalha", 
            "Manta", "Lençol", "Cueiro", "Chupeta", "Mamadeira", 
            "Chocalho", "Mordedor", "Termômetro", "Aspirador", "Naninha"
        ];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function entrarNoJogo() {
            const input = document.getElementById('nomeJogador').value.trim();
            if (input === "") return alert("Por favor, digite seu nome!");
            
            meuNome = input;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('bingo-screen').style.display = 'flex';
            document.getElementById('displayNome').innerText = meuNome;

            gerarCartela();
        }

        function gerarCartela() {
            const board = document.getElementById('board');
            board.innerHTML = ""; 
            document.getElementById('bingoMensagem').style.display = 'none'; 

            let cartela = shuffle([...palavras]).slice(0, 15);
            
            // Adicionado <br> para quebrar a linha no nome
            cartela.splice(5, 0, "LEVI<br>HENRIQUE"); 

            db.ref('jogadores/' + meuNome).set({
                pontos: 0,
                status: "Jogando..."
            });

            cartela.forEach((palavra, index) => {
                const div = document.createElement('div');
                div.className = 'cell';
                
                // Alterado para innerHTML para ler o <br> corretamente
                div.innerHTML = palavra; 
                
                if (index === 5) { 
                    div.classList.add('central');
                } else {
                    div.onclick = function() { marcar(this); };
                }
                board.appendChild(div);
            });
        }

        function marcar(elemento) {
            elemento.classList.toggle('marcado');
            
            const marcados = document.querySelectorAll('.marcado').length;
            const bateuBingo = marcados === 15;

            db.ref('jogadores/' + meuNome).update({
                pontos: marcados,
                status: bateuBingo ? "🔥 BINGO!!!" : "Jogando..."
            });

            if(bateuBingo) {
                document.getElementById('bingoMensagem').style.display = 'block';
            }
        }
    </script>
</body>
</html>
